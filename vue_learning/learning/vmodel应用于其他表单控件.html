<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <input type="text" v-model="message">   <br>


        是否单身：<input type="checkbox" v-model="isSingle"><br>


        性别：<input type="radio" name="gender" v-model="gender" value="男">男
        <input type="radio" name="gender" value v-model="gender" value="女">女  <br>
        
        
        所在城市：<select v-model="city">
            <option value="北京">北京</option>
            <option value="上海">上海</option>
            <option value="广州">广州</option>
        </select><br>


        自我描述：<textarea v-model="selfDesc"></textarea><br>

        <!-- 是否单身：{{ isSingleDesc }} -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el:'#app',
            data:{
                message:'hello vue',
                isSingle:false,
                gender:'男',
                city:'北京',
                selfDesc:''
            },
            watch:{
                isSingle(newVal,oldVal){
                    console.log(newVal,oldVal)
                }
            }
        })
    </script>
</body>
</html>
