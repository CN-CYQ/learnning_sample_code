<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="app">
        <h1>{{ count }}</h1>
        <input class="message" type="text">
        <button @click="count++">增加</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script>
        const app = new Vue({
            el:'#app',
            data:{
                count: 0
            },

            // 1.创建阶段（准备数据）
            beforeCreate(){
                console.log('beforeCreate')
            },
            created(){
                // 数据准备完成，实例创建完成
                // 可以开始发送数据请求
                console.log('created')
            },

            // 2.挂载阶段（挂载到页面）
            beforeMount(){
                console.log('beforeMount')
            },
            mounted(){
                // 挂载完成，实例挂载到页面上，可以操作DOM
                console.log('mounted')
                const messageInput = document.querySelector('.message')
                messageInput.focus()
            },

            // 3.更新阶段（数据变化时触发）
            beforeUpdate(){
                console.log('beforeUpdate 数据修改了，试图还没更新')
            },
            updated(){
                console.log('updated 数据更新了，试图也更新了')
            },

            // 4.销毁阶段（实例被销毁时触发）
            beforeDestroy(){
                console.log('beforeDestroy')
                // 实例被销毁前，可以进行清理工作
                // 例如：取消事件监听、移除DOM元素、定时器等
            },
            destroyed(){
                console.log('destroyed')
            }
        })
    </script>
</body>
</html>
