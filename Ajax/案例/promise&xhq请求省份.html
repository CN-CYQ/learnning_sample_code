<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="province"></pp>
    <script>
        const xhq = new XMLHttpRequest();
        xhq.open('get','http://hmajax.itheima.net/api/province');
        const p = new Promise((resolve, reject)=>{

            xhq.addEventListener('loadend', () => {
                
                if(xhq.status === 200){
                    resolve(JSON.parse(xhq.responseText));
                }else{
                    reject(new Error('请求失败'));
                }
            })
            xhq.send();
            
        })
        p.then(res=>{
            console.log(res);
            document.getElementById('province').innerHTML = res.list;
        }).catch(err=>{
            console.log(err);
        })
    </script>
</body>
</html>
