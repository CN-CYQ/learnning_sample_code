<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="province"></div>
    <div class="city"></div>
    <div class="area"></div>

    <script src="http://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        // 1 定义async修饰函数
        async function getProvince(){
            try{
                // await 等待异步操作完成
                const province = await axios.get('http://hmajax.itheima.net/api/province')
                const pname = province.data.list[0]
                document.querySelector('.province').innerHTML = pname
                const city = await axios({url: 'http://hmajax.itheima.net/api/city', params: { pname }})
                const cname = city.data.list[0] 
                document.querySelector('.city').innerHTML = cname
                const area = await axios({url: 'http://hmajax.itheima.net/api/area', params: {pname, cname }})
                document.querySelector('.area').innerHTML = area.data.list[0]
            } catch (error) {
                console.log(error);
            }
            // return area.data.list
        }
        getProvince()
    </script>
</body>
</html>
