<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="province"></p>
    <script>
        function myAxios(options){
            const xhr = new XMLHttpRequest();
            // 设置请求头格式 默认get
            xhr.open(options.method || 'get',options.url + (options.params ? '?' + new URLSearchParams(options.params).toString() : ''));

            return new Promise((resolve, reject)=>{
                xhr.addEventListener('loadend', () => {
                    if(xhr.status === 200){
                        resolve(JSON.parse(xhr.responseText));
                    }else{
                        reject(new Error('请求失败'));
                    }
                })
                // 判断有 data 选项，携带请求体
                if(options.data){
                    const jsonStr = JSON.stringify(options.data);
                    xhr.setRequestHeader('Content-Type', 'multipart/form-data');
                    xhr.send(jsonStr);
                }else{
                    xhr.send();
                }
                // xhr.send();
            })
        }

        myAxios({
            url: 'http://hmajax.itheima.net/api/weather',
            method: 'get',
            params: {
                city: 110100,
            },
            data: {
                username: '张三',
                password: '123456',
            }
        })
        .then(res=>{
            console.log(res);
            document.getElementById('province').innerHTML = res.list;
        }).catch(err=>{
            console.log(err);
        })
    </script>
</body>
</html>
