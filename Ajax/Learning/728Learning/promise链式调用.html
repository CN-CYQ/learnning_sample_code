<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. 创建一个promise对象
        const p = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve('成功')
            }, 2000);
        })
        // 2. 调用then方法
        const p2 = p.then(res => {
            console.log(res);
            // 3. 返回一个新的promise对象
            // return Premise对象最终状态和结果会影响新Promise对象
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve('成功2')
                }, 2000);
            })
        })

        // 3. 调用then方法
        p2.then(res => {
            console.log(res);
        })
    </script>
</body>
</html>
